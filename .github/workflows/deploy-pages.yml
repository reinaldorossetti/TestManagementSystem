name: Deploy Static Demo to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
  DATABASE_URL: "file:./prisma/dev.db"
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Build & Deploy Site to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Prisma Client
        env:
          DATABASE_URL: "file:./prisma/dev.db"
        run: npx prisma generate

      - name: Build Next.js Production Bundle
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Prepare GitHub Pages Distribution Folder
        run: |
          mkdir -p out-gh-pages
          cp -r public/* out-gh-pages/ 2>/dev/null || true
          cp .next/server/app/*.html out-gh-pages/ 2>/dev/null || true
          mkdir -p out-gh-pages/_next
          cp -r .next/static out-gh-pages/_next/
          sed -i 's|/_next/|./_next/|g' out-gh-pages/*.html 2>/dev/null || true
          touch out-gh-pages/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out-gh-pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
