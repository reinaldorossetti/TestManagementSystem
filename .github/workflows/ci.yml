name: CI / QA Automated Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, Build & E2E Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: "file:./prisma/ci.db"
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_USE_PREBUILT: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python & Robot Framework Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-browser robotframework-requests

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Setup Prisma Database Schema
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run db:seed || true

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application
        run: npm run build

      - name: Run Playwright E2E Test Suite
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results / Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
