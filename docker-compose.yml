services:
  tms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tms_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      # Persist SQLite database file across container restarts
      - ./prisma:/app/prisma
      - ./results:/app/results
      - ./test_projects:/app/test_projects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 1) Cloudflare Quick Tunnel (HTTPS publico instantaneo sem conta/dominio)
  # Uso: docker compose --profile tunnel-quick up -d
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: tms_cloudflared_quick
    profiles: ["tunnel-quick"]
    restart: unless-stopped
    depends_on:
      tms-app:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://tms-app:3000

  # 2) Cloudflare Named Tunnel (Dominio proprio fixo com HTTPS via token no .env)
  # Uso: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tms_cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      tms-app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  # 3) Tailscale Funnel (URL HTTPS fixa gratuita *.ts.net via TS_AUTHKEY no .env)
  # Uso: docker compose --profile tailscale-funnel up -d
  tailscale-funnel:
    image: tailscale/tailscale:latest
    container_name: tms_tailscale_funnel
    profiles: ["tailscale-funnel"]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-tms-qa-center}
    depends_on:
      tms-app:
        condition: service_healthy
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./scripts/tailscale-serve.json:/config/serve.json:ro

volumes:
  tailscale-state:
